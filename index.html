<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keel</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<style>
  html, body { margin: 0; height: 100%; background:#000; color: #fff; }
  [hidden] { display: none !important; } /* .screen sets display, which would otherwise beat the hidden attribute */
  body { font: 17px/1.4 -apple-system, system-ui, sans-serif; }

  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; text-align: center;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  }
  .screen p { margin: 0; max-width: 300px; }
  .muted { color: #8e8e93; font-size: 15px; }
  .error { color: #ff453a; font-size: 15px; min-height: 1.4em; }

  input {
    width: min(300px, 100%); box-sizing: border-box; padding: 12px 14px; border-radius: 12px;
    border: 1px solid #333; background: #111; color: #fff; font: 15px ui-monospace, monospace;
  }
  input:focus { outline: none; border-color: #888; }
  button {
    min-width: 200px; padding: 14px 24px; border-radius: 999px; border: 0; cursor: pointer;
    background: #fff; color: #000; font: 600 17px -apple-system, system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  button:disabled { opacity: .5; }
  button.plain { background: none; color: #8e8e93; font-weight: 400; }
  button:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  /* Money (Keel's home). Accents: amber owns spending, mint owns saving and money in. */
  .mny { --spend: #e3a83c; --save: #70d8c8; --muted: #8e8e93; --line: #2c2c2e; --tile: #1c1c1e; font-variant-numeric: tabular-nums; }
  .mny button { min-width: 0; padding: 0; border: 0; border-radius: 0; background: none; color: inherit; font: inherit; text-align: inherit; }
  .mny .spend { color: var(--spend); } .mny .save { color: var(--save); } .mny .muted { color: var(--muted); } .mny .small { font-size: 12px; }
  #money { max-width: 430px; margin: 0 auto; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;
    padding: calc(env(safe-area-inset-top) + 8px) max(14px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 28px) max(14px, env(safe-area-inset-left)); }
  .mny .micro { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .mny .micro.spend { color: var(--spend); } .mny .micro.save { color: var(--save); }
  .mny .m-top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; }
  .mny .m-top a { color: var(--muted); text-decoration: none; font-size: 15px; min-height: 44px; display: inline-flex; align-items: center; justify-self: start; }
  .mny .m-top b { font-size: 17px; }
  .mny .icon-btn { justify-self: end; color: var(--muted); min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: flex-end; }
  .mny .m-emptybox { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
  .mny .m-empty { margin: 0; color: var(--muted); }
  .mny .primary { min-height: 48px; padding: 0 22px; border-radius: 24px; background: #fff; color: #000; font-weight: 600; text-align: center; }
  .mny .ghost-btn { min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #3a3a3c; font-size: 14px; font-weight: 500; text-align: center; }
  .mny .linkish { color: var(--muted); font-size: 13px; min-height: 44px; }
  .mny .linkish.center { align-self: center; }
  .mny .whose { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; background: var(--tile); border-radius: 10px; padding: 3px; }
  .mny .whose button { min-height: 36px; border-radius: 8px; font-size: 13px; font-weight: 500; text-align: center; }
  .mny .whose button[aria-pressed="true"] { background: #fff; color: #000; }
  .mny .month { display: flex; align-items: center; justify-content: space-between; }
  .mny .month button { width: 44px; height: 44px; color: var(--muted); font-size: 20px; text-align: center; }
  .mny .month button:disabled { opacity: .25; }
  .mny .month span { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; text-align: center; }
  .mny .month small { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
  .mny .hero { background: var(--tile); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
  .mny .big { font-size: 62px; font-weight: 800; letter-spacing: -0.045em; line-height: .9; color: var(--spend); }
  .mny .big small { font-size: 22px; font-weight: 600; letter-spacing: 0; }
  .mny .row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; }
  .mny .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .mny .tile { background: var(--tile); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .mny .tile b { font-size: 19px; font-weight: 700; }
  .mny .panel { background: var(--tile); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .mny .legend { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
  .mny .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  .mny .p-me { background: #fff; } .mny .p-partner { background: #8e8e93; } .mny .p-unknown { background: #3a3a3c; }
  .mny .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .mny .chip { min-height: 32px; padding: 0 11px; border-radius: 16px; border: 1px solid var(--line); font-size: 12.5px; display: inline-flex; align-items: center; }
  .mny .chip.on { background: #fff; color: #000; border-color: #fff; }
  .mny .cat { display: flex; flex-direction: column; gap: 5px; }
  .mny .cat-line { display: flex; justify-content: space-between; font-size: 14px; }
  .mny .bar { height: 3px; background: #2c2c2e; border-radius: 2px; }
  .mny .bar i { display: block; height: 100%; border-radius: 2px; background: #8e8e93; }
  .mny .bar i.lead { background: var(--spend); }
  .mny .sub { font-size: 12px; color: var(--muted); }
  .mny .heat { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .mny .heat span { aspect-ratio: 1; border-radius: 3px; background: #161618; font-size: 9.5px; color: #636366; display: flex; align-items: flex-start; justify-content: flex-end; padding: 2px 3px; box-sizing: border-box; }
  .mny .heat .h { aspect-ratio: auto; background: none; justify-content: center; font-size: 11px; color: var(--muted); padding: 0; }
  .mny .heat .blank { background: none; }
  .mny .sv-total { font-size: 30px; font-weight: 800; letter-spacing: -0.03em; }
  .mny .sv-row { display: flex; flex-direction: column; gap: 6px; width: 100%; padding: 2px 0; }
  .mny .sv-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; width: 100%; }
  .mny .sv-name { font-size: 15px; font-weight: 500; }
  .mny .sv-name small, .mny .sv-bal small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
  .mny .sv-bal { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; text-align: right; }
  .mny .sv-bal small.save { color: var(--save); font-weight: 500; }
  .mny .sv-bar { display: block; height: 4px; border-radius: 2px; background: #2c2c2e; overflow: hidden; width: 100%; }
  .mny .sv-bar i { display: block; height: 100%; background: var(--save); }
  .mny .split { display: flex; height: 10px; border-radius: 3px; overflow: hidden; gap: 2px; width: 100%; }
  .mny .foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
  .mny .feed { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 0 10px; padding: 4px 4px 0; }
  .mny .day { font-size: 13px; font-weight: 600; line-height: 1.1; }
  .mny .day span { display: block; font-size: 24px; font-weight: 300; }
  .mny .items { border-left: 1px solid #3a3a3c; padding: 0 0 18px 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .mny .items.coming { border-left-style: dashed; }
  .mny .tx { display: flex; justify-content: space-between; gap: 10px; width: 100%; font-size: 15px; }
  .mny .tx > span:first-child { display: flex; flex-direction: column; gap: 1px; min-width: 0; overflow-wrap: anywhere; }
  .mny .tx small { color: var(--muted); font-size: 12px; }
  .mny .who { display: inline-block; min-width: 16px; padding: 0 4px; margin-right: 6px; border: 1px solid #3a3a3c; border-radius: 4px; font-size: 10px; line-height: 14px; text-align: center; color: var(--muted); }
  .mny .two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .mny .two b { font-size: 21px; font-weight: 800; letter-spacing: -0.03em; overflow-wrap: anywhere; }
  .mny .two b.merch { font-size: 17px; }
  .mny .two .per { font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .mny .two p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
  .mny .fine { color: #636366; font-size: 11.5px; line-height: 1.45; text-align: center; margin: 0; padding: 4px 8px 0; }
  .mny .fine.left { text-align: left; padding: 0; }
  /* sheets */
  .mny.sheet-layer { display: flex; flex-direction: column; justify-content: flex-end; background: rgba(0,0,0,.55); } /* beats .layer's solid black */
  .mny.sheet-layer[hidden] { display: none !important; }
  .sheet-layer .sheet-back { flex: 1; }
  .mny .sheet { background: #121214; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; max-height: 88vh; overflow-y: auto; box-sizing: border-box;
    padding: 6px 18px calc(env(safe-area-inset-bottom) + 24px); display: flex; flex-direction: column; gap: 14px; max-width: 520px; width: 100%; margin: 0 auto; }
  .mny .sheet-head { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; }
  .mny .grab { width: 36px; height: 5px; border-radius: 3px; background: #3a3a3c; grid-column: 2; justify-self: center; }
  .mny .x { grid-column: 3; width: 44px; height: 44px; font-size: 26px; color: var(--muted); text-align: center; }
  .mny .sheet h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .mny .amount { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; }
  .mny .kv { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 9px 12px; font-size: 14px; margin: 0; }
  .mny .kv dt { color: var(--muted); }
  .mny .kv dd { margin: 0; overflow-wrap: anywhere; }
  .mny .pill { display: inline-block; border: 1px solid #3a3a3c; border-radius: 10px; padding: 1px 8px; font-size: 12px; margin: 0 4px 2px 0; }
  .mny .link-btn { min-height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 22px; background: #fff; color: #000; font-weight: 600; text-decoration: none; }
  /* settings */
  #m-settings { padding: 0 max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 28px) max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 12px; }
  #m-settings[hidden] { display: none !important; }
  #m-settings .m-top { position: sticky; top: 0; background: #000; padding-top: calc(env(safe-area-inset-top) + 8px); z-index: 1; }
  .mny h3 { margin: 8px 0 0; font-size: 13px; font-weight: 600; color: var(--muted); }
  .mny .pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .mny .field, .mny .conn-block { display: flex; flex-direction: column; gap: 6px; }
  .mny .field label, .mny .conn-block label { font-size: 13px; color: var(--muted); }
  .mny input { width: 100%; min-width: 0; min-height: 44px; box-sizing: border-box; background: var(--tile); border: 1px solid var(--line); border-radius: 10px; color: #fff; font: 15px -apple-system, system-ui, sans-serif; padding: 0 12px; }
  .mny .conn-row { display: flex; gap: 8px; }
  .mny .conn-row .ghost-btn { flex: none; }
  .mny .tok-msg { font-size: 13px; min-height: 1.2em; color: var(--muted); }
  .mny .tok-msg.save { color: var(--save); }
  .mny .conn { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--tile); border-radius: 10px; padding: 12px; }
  .mny .conn span { display: flex; flex-direction: column; gap: 2px; }
  .mny .conn small { color: var(--muted); font-size: 12px; }

  /* Photo a day */
  #prompt { display: flex; align-items: center; justify-content: center; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
  #prompt[hidden] { display: none !important; }
  #prompt-close { position: absolute; top: calc(env(safe-area-inset-top) + 8px); right: max(12px, env(safe-area-inset-right)); width: 44px; height: 44px;
    min-width: 0; padding: 0; font-size: 28px; color: #8e8e93; }
  .prompt-body { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; max-width: 320px; }
  .prompt-body h2 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  .prompt-body p { margin: 0; color: #8e8e93; }
  .prompt-body .prompt-late { color: #e3a83c; }
  #prompt-msg:empty { display: none; }
  #prompt-continue { min-height: 44px; color: #fff; }
  .ph-top { position: sticky; top: 0; padding: calc(env(safe-area-inset-top) + 8px) 16px 0; background: #000; z-index: 1; }
  .ph-top .plain { min-width: 0; padding: 10px 4px; color: #fff; }
  .home {
    min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; text-align: center;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  }
  .home p { margin: 0; max-width: 320px; }
  #today { font-size: 22px; }
  #today:empty, #message:empty { display: none; }
  #message, #month-line { color: #8e8e93; font-size: 15px; }
  .layer { position: fixed; inset: 0; z-index: 10; background: #000; }
  .layer video { width: 100%; height: 100%; object-fit: cover; }
  .layer video.mirror { transform: scaleX(-1); }
  .camera-bar {
    position: absolute; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 32px);
    display: flex; justify-content: center; align-items: center;
  }
  .shutter {
    width: 76px; height: 76px; min-width: 0; padding: 0; border-radius: 50%;
    background: #fff; border: 4px solid #000; box-shadow: 0 0 0 3px #fff;
  }
  .shutter:active { background: #ccc; }
  .flip {
    position: absolute; right: 24px; min-width: 0; padding: 10px 16px;
    background: rgba(0,0,0,.45); color: #fff; font-weight: 400; font-size: 15px;
  }

  #months { display: flex; flex-direction: column; gap: 4px; margin-top: 12px; }
  .month-row { min-width: 0; padding: 10px 16px; color: #fff; font-size: 17px; }

  #reveal, #viewer { display: flex; align-items: center; justify-content: center; cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; }
  #reveal img, #viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .reveal-label {
    position: absolute; left: 16px; bottom: calc(env(safe-area-inset-bottom) + 16px); margin: 0;
    color: #8e8e93; font-size: 13px; font-variant-numeric: tabular-nums;
  }
  .reveal-wait { color: #8e8e93; margin: 0; }

  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #grid { padding: calc(env(safe-area-inset-top) + 8px) 12px calc(env(safe-area-inset-bottom) + 24px); box-sizing: border-box; }
  #grid header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  #grid .back { min-width: 0; padding: 8px 4px; color: #fff; }
  .grid-title { margin: 0; font-size: 17px; font-weight: 600; }
  .grid-head, .grid-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .grid-head span { text-align: center; color: #8e8e93; font-size: 12px; padding-bottom: 4px; }
  .cell { aspect-ratio: 3 / 4; border-radius: 4px; overflow: hidden; }
  .cell.photo { min-width: 0; padding: 0; background: #111; }
  .cell.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell.missed { display: flex; align-items: center; justify-content: center; color: #3a3a3c; font-size: 13px; background: #0a0a0a; }
</style>
</head>
<body>
<form id="token" class="screen" hidden>
  <p>Paste your GitHub code</p>
  <input type="password" aria-label="GitHub code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
  <button type="submit">Continue</button>
  <p class="error" role="alert"></p>
</form>

<div id="setup" class="screen" hidden>
  <p>Unlock Keel with Face ID?</p>
  <button id="setup-on">Turn on</button>
  <button id="setup-skip" class="plain">Not now</button>
  <p class="error" role="alert"></p>
</div>

<div id="locked" class="screen" hidden>
  <button id="unlock">Unlock with Face ID</button>
  <p class="error" role="alert"></p>
</div>

<main id="app" hidden><div id="money-root"></div><div id="photos-root"></div></main>

<script type="module">
  import { startPhotos } from './photos.js';
  import { startMoney } from './money.js';
  navigator.serviceWorker?.register('sw.js').catch(() => {}); // lets Keel open with no signal
  // Same model as Yarvo Box Stock: this page is public, the data lives in a private repo,
  // and the "GitHub code" is a fine-grained token that can only reach that repo.
  const DATA_REPO = 'PokornyPokorny/keel-data';
  const TOKEN_KEY = 'keel-token', PASSKEY_KEY = 'keel-passkey', REJECTED_KEY = 'keel-token-rejected';
  const REJECTED = 'GitHub rejected the saved code.';

  const $ = id => document.getElementById(id);
  const screens = ['token', 'setup', 'locked', 'app'];
  const fail = (id, msg) => { $(id).querySelector('.error').textContent = msg; };
  const get = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const put = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

  const photos = startPhotos({
    root: $('photos-root'),
    behind: $('money-root'),                 // the daily photo prompt covers Money until it's dealt with
    getToken: () => get(TOKEN_KEY),
    // A rejected code goes back to the paste screen; photos waiting to upload stay queued.
    onUnauthorized() {
      try { localStorage.removeItem(TOKEN_KEY); } catch {}
      put(REJECTED_KEY, '1'); // keep the reason until a new code is pasted, even across reopening Keel
      show('token');
      fail('token', REJECTED);
    },
  });
  // Money is Keel's home; photo a day lives behind its Photos link (and its daily prompt).
  const money = startMoney({ root: $('money-root'), onPhotos: () => photos.openHome() });
  function show(id) {
    screens.forEach(s => $(s).hidden = s !== id);
    if (id === 'app') { money.refresh(); photos.refresh(); }
  }

  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const random = n => crypto.getRandomValues(new Uint8Array(n));

  async function faceIdAvailable() {
    try { return !!window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
    catch { return false; }
  }

  // shortcut: Face ID gates this device's screen only. With no server, nothing checks the passkey's signature;
  // the real protection is the token, which never leaves this phone. Upgrade path: WebAuthn PRF to encrypt the token.
  async function faceId() {
    await navigator.credentials.get({ publicKey: {
      challenge: random(32), userVerification: 'required', timeout: 60000,
      allowCredentials: [{ type: 'public-key', id: unb64(get(PASSKEY_KEY)), transports: ['internal', 'hybrid'] }],
    }});
  }

  async function unlock() {
    $('unlock').disabled = true; fail('locked', '');
    try { await faceId(); show('app'); }
    catch (e) { if (e.name !== 'NotAllowedError') fail('locked', 'Face ID did not work: ' + e.message); }
    finally { $('unlock').disabled = false; }
  }

  async function afterToken() {
    if (get(PASSKEY_KEY)) { show('locked'); unlock(); return; } // Safari may need a tap first; the button stays as the fallback
    if (get('keel-faceid-skipped') || !(await faceIdAvailable())) { show('app'); return; }
    show('setup');
  }

  $('token').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('token').querySelector('button'), token = $('token').querySelector('input').value.trim();
    if (!token) return;
    btn.disabled = true; fail('token', '');
    try {
      const r = await fetch('https://api.github.com/repos/' + DATA_REPO, {
        headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' },
      });
      if (r.status === 401) return fail('token', 'GitHub rejected that code.');
      if (r.status === 404 || r.status === 403) return fail('token', 'That code can’t see ' + DATA_REPO + '. Give it Contents access to that repo.');
      if (!r.ok) return fail('token', 'GitHub answered ' + r.status + '. Try again in a minute.');
      put(TOKEN_KEY, token);
      try { localStorage.removeItem(REJECTED_KEY); } catch {}
      afterToken();
    } catch {
      fail('token', 'No connection. Try again once you have signal.');
    } finally { btn.disabled = false; }
  });

  $('setup-on').addEventListener('click', async () => {
    fail('setup', '');
    try {
      const cred = await navigator.credentials.create({ publicKey: {
        challenge: random(32), rp: { name: 'Keel' },
        user: { id: random(16), name: 'Keel', displayName: 'Keel' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
        timeout: 60000,
      }});
      put(PASSKEY_KEY, b64(cred.rawId));
      show('app');
    } catch (e) {
      fail('setup', e.name === 'NotAllowedError' ? 'Face ID was cancelled.' : 'Could not set up Face ID: ' + e.message);
    }
  });
  $('setup-skip').addEventListener('click', () => { put('keel-faceid-skipped', '1'); show('app'); });
  $('unlock').addEventListener('click', unlock);

  // Like the phone: leaving the app locks it.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && get(PASSKEY_KEY) && !$('app').hidden) show('locked');
    else if (!document.hidden && !$('locked').hidden) unlock();
  });

  if (get(TOKEN_KEY)) afterToken();
  else { show('token'); if (get(REJECTED_KEY)) fail('token', REJECTED); }
</script>
</body>
</html>
