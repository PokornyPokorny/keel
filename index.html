<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Keel</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<style>
  html, body { margin: 0; height: 100%; background:#000; color: #fff; }
  [hidden] { display: none !important; } /* .screen sets display, which would otherwise beat the hidden attribute */
  body { font: 17px/1.4 -apple-system, system-ui, sans-serif; }

  .screen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; text-align: center;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  }
  .screen p { margin: 0; max-width: 300px; }
  .muted { color: #8e8e93; font-size: 15px; }
  .error { color: #ff453a; font-size: 15px; min-height: 1.4em; }

  input {
    width: min(300px, 100%); box-sizing: border-box; padding: 12px 14px; border-radius: 12px;
    border: 1px solid #333; background: #111; color: #fff; font: 15px ui-monospace, monospace;
  }
  input:focus { outline: none; border-color: #888; }
  button {
    min-width: 200px; padding: 14px 24px; border-radius: 999px; border: 0; cursor: pointer;
    background: #fff; color: #000; font: 600 17px -apple-system, system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  button:disabled { opacity: .5; }
  button.plain { background: none; color: #8e8e93; font-weight: 400; }
  button:focus-visible, input:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<form id="token" class="screen" hidden>
  <p>Paste your GitHub code</p>
  <input type="password" aria-label="GitHub code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="github_pat_…">
  <button type="submit">Continue</button>
  <p class="error" role="alert"></p>
</form>

<div id="setup" class="screen" hidden>
  <p>Unlock Keel with Face ID?</p>
  <button id="setup-on">Turn on</button>
  <button id="setup-skip" class="plain">Not now</button>
  <p class="error" role="alert"></p>
</div>

<div id="locked" class="screen" hidden>
  <button id="unlock">Unlock with Face ID</button>
  <p class="error" role="alert"></p>
</div>

<main id="app" hidden></main>

<script>
  // Same model as Yarvo Box Stock: this page is public, the data lives in a private repo,
  // and the "GitHub code" is a fine-grained token that can only reach that repo.
  const DATA_REPO = 'PokornyPokorny/keel-data';
  const TOKEN_KEY = 'keel-token', PASSKEY_KEY = 'keel-passkey';

  const $ = id => document.getElementById(id);
  const screens = ['token', 'setup', 'locked', 'app'];
  const show = id => screens.forEach(s => $(s).hidden = s !== id);
  const fail = (id, msg) => { $(id).querySelector('.error').textContent = msg; };
  const get = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const put = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const random = n => crypto.getRandomValues(new Uint8Array(n));

  async function faceIdAvailable() {
    try { return !!window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); }
    catch { return false; }
  }

  // shortcut: Face ID gates this device's screen only. With no server, nothing checks the passkey's signature;
  // the real protection is the token, which never leaves this phone. Upgrade path: WebAuthn PRF to encrypt the token.
  async function faceId() {
    await navigator.credentials.get({ publicKey: {
      challenge: random(32), userVerification: 'required', timeout: 60000,
      allowCredentials: [{ type: 'public-key', id: unb64(get(PASSKEY_KEY)), transports: ['internal', 'hybrid'] }],
    }});
  }

  async function unlock() {
    $('unlock').disabled = true; fail('locked', '');
    try { await faceId(); show('app'); }
    catch (e) { if (e.name !== 'NotAllowedError') fail('locked', 'Face ID did not work: ' + e.message); }
    finally { $('unlock').disabled = false; }
  }

  async function afterToken() {
    if (get(PASSKEY_KEY)) { show('locked'); unlock(); return; } // Safari may need a tap first; the button stays as the fallback
    if (get('keel-faceid-skipped') || !(await faceIdAvailable())) { show('app'); return; }
    show('setup');
  }

  $('token').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('token').querySelector('button'), token = $('token').querySelector('input').value.trim();
    if (!token) return;
    btn.disabled = true; fail('token', '');
    try {
      const r = await fetch('https://api.github.com/repos/' + DATA_REPO, {
        headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json' },
      });
      if (r.status === 401) return fail('token', 'GitHub rejected that code.');
      if (r.status === 404 || r.status === 403) return fail('token', 'That code can’t see ' + DATA_REPO + '. Give it Contents access to that repo.');
      if (!r.ok) return fail('token', 'GitHub answered ' + r.status + '. Try again in a minute.');
      put(TOKEN_KEY, token);
      afterToken();
    } catch {
      fail('token', 'No connection. Try again once you have signal.');
    } finally { btn.disabled = false; }
  });

  $('setup-on').addEventListener('click', async () => {
    fail('setup', '');
    try {
      const cred = await navigator.credentials.create({ publicKey: {
        challenge: random(32), rp: { name: 'Keel' },
        user: { id: random(16), name: 'Keel', displayName: 'Keel' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred' },
        timeout: 60000,
      }});
      put(PASSKEY_KEY, b64(cred.rawId));
      show('app');
    } catch (e) {
      fail('setup', e.name === 'NotAllowedError' ? 'Face ID was cancelled.' : 'Could not set up Face ID: ' + e.message);
    }
  });
  $('setup-skip').addEventListener('click', () => { put('keel-faceid-skipped', '1'); show('app'); });
  $('unlock').addEventListener('click', unlock);

  // Like the phone: leaving the app locks it.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && get(PASSKEY_KEY) && !$('app').hidden) show('locked');
    else if (!document.hidden && !$('locked').hidden) unlock();
  });

  if (get(TOKEN_KEY)) afterToken(); else show('token');
</script>
</body>
</html>
